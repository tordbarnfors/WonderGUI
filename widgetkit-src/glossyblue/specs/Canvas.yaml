# Swapped with Window: Canvas carries black text (TextEditor, LineEditor,
# SelectBox list) so it must be the brightest surface -- Colors::Canvas
# has always been Color::White, the dark skin contradicted it. The flat
# vertical bevel also stretches without the banding the diagonal showed
# over the large areas a canvas usually covers.
recipe: flat_bevel_panel
palette: canvas
size_pts: [12, 12]
radius_pts: 3
axis: single
states: [Default]

# Was also frameless, so a stretched panel smeared its 1px border and rounded
# corners into a wide blur -- the whole block was being scaled. frame 4
# is >= radius_pts (3), which keeps the corner arcs inside the fixed
# corner cells; only the 4pt middle stretches. The body gradient is
# subtle enough that splitting it across frame/middle shows no banding.
# Size is now frame*2 + middle rather than 16pts of mostly-repeated pixels.
frame_pts: 4
# 2 -> 1. Canvas is now only the bare surface: the SelectBox drop-down's
# background, and whatever app code paints on it. Its children there are
# SelectBoxEntry rows, whose selection highlight wants to reach the edge, so a
# 1pt inset is right for it. The editors moved to Skins::Field, which keeps the
# old 2 because text does want to clear the border -- that divergence is the
# whole reason the two were split.
padding_pts: 1
