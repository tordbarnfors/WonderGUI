recipe: raised_control
shape: rect
# Size is set by the arrow plus a uniform 3pt margin. The 16pt dimension is
# fixed by the scrollbar's thickness -- it must match ScrollbarHandleY's
# width -- so only the base-to-tip axis shrank (was [16, 14]).
# The arrow box is the same 10x5 as the select box's, transposed for the
# horizontal directions, so all five arrows in the kit are one shape.
size_pts: [16, 11]
radius_pts: 2
axis: y
spacing_pts: 1
states: [Default, Hovered, Pressed, Disabled]
glyph: {type: arrow, direction: down, arrow_w_pts: 10, arrow_h_pts: 5}
