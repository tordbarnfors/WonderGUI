recipe: raised_control
shape: rect
# Square, matching the scrollbar's thickness on both axes -- ScrollbarHandleX's height
# fixes the 16. It was [11, 16], which looked squashed next to the handle.
# The arrow is unchanged (5x10, the same shape as the select box's,
# transposed for the horizontal directions); add_arrow_glyph centres it in
# whatever block it is given via centered_span(), so growing the block just
# gives it more room rather than moving it off centre.
size_pts: [16, 16]
radius_pts: 2
axis: x
block_spacing_pts: 1
states: [Default, Hovered, Pressed, Disabled]
glyph: {type: arrow, direction: left, arrow_w_pts: 5, arrow_h_pts: 10}

# The arrow sinks 1pt down-right while the button is held, matching the rest of
# the kit. glyph_shift, not BlockSkin's contentShift: the arrow is part of the
# block, and a scrollbar button has no content of its own. Pressed is the only
# state that needs it -- it is the only one that looks pushed in.
glyph_shift:
  Pressed: [1, 1]
