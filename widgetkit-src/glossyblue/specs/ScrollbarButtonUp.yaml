recipe: raised_control
shape: rect
# Square, matching the scrollbar's thickness on both axes -- ScrollbarHandleY's width
# fixes the 16. It was [16, 11], which looked squashed next to the handle.
# The arrow is unchanged (10x5, the same shape as the select box's,
# transposed for the horizontal directions); add_arrow_glyph centres it in
# whatever block it is given via centered_span(), so growing the block just
# gives it more room rather than moving it off centre.
size_pts: [16, 16]
radius_pts: 2
axis: y
spacing_pts: 1
states: [Default, Hovered, Pressed, Disabled]
glyph: {type: arrow, direction: up, arrow_w_pts: 10, arrow_h_pts: 5}
