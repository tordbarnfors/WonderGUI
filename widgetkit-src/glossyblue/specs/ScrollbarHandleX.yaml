recipe: raised_control
shape: rect
size_pts: [28, 16]
radius_pts: 3
axis: x
block_spacing_pts: 1
states: [Default, Hovered, Pressed, Disabled]
frame_pts: [8, 7, 8, 7]
padding_pts: 6
# sections: All, not Center -- the frame spans this handle's full
# height, so the Center Y section is zero-sized and never renders;
# a rigid part masked to Center alone was dead code and the grip
# smeared. All also survives a later change to the frame.
# Grip ridges run ACROSS the drag axis, hence direction: vertical.
# What must fit inside the rigid run 8..20pts is the lines' SPREAD
# (2 * spacing, ~6pts), not len_pts -- len_pts is their length along
# the cross axis, which never stretches.
rigid_part: {axis: x, begin_pts: 8, length_pts: 12, sections: All}
glyph: {type: grip, direction: vertical, len_pts: 10}

# The grip sinks 1pt down-right while the handle is dragged, matching the rest
# of the kit. glyph_shift, not BlockSkin's contentShift: this is a plain
# BlockSkin (the DoubleSkin in this kit is the SPLIT handle, not this one), but
# the grip is drawn into the block and a scrollbar handle has no content.
#
# The shift has to stay inside the rigid run, or the part of it that pokes out
# lands in stretchable material and smears as the handle grows. The grip's
# 6pt spread is centred at x 14 (11..17) inside the rigid 8..20, so 1pt of
# travel still leaves 2pts of margin. Only the x axis stretches here -- the
# frame spans the full height -- so the y component is free.
glyph_shift:
  Pressed: [1, 1]
