recipe: raised_control
palette_family: plate
shape: rect
# The VERTICAL bar, used by SplitPanelX (children side by side, dragged
# left/right). SplitPanel takes the bar's thickness from this skin's WIDTH
# when axis == Axis::X (wg_splitpanel.cpp, _handleThickness), so 8pts wide
# is the bar thickness; the height is only a starting size -- the bar is
# stretched to the panel's full height.
#
# palette_family: plate gives it Plate's grey rather than the blue accent, so
# it reads as furniture, while still picking up the normal hover/pressed/
# disabled treatment from STATE_STYLE.
#
# Thickness narrowed 12 -> 8. Everything on the cross axis had to come down
# with it (see below): at 12pts the 3pt corner radius, 3pt frames and 2.5pt
# dots all had room to spare; at 8 they are what sets the proportions.
size_pts: [8, 44]
radius_pts: 2
axis: x
spacing_pts: 1
states: [Default, Hovered, Pressed, Disabled]
frame_pts: [8, 2, 8, 2]
padding_pts: 2

# Geometry, in block coords. The mid (rigid) section is 24pts, which sets the
# block height: frames 8+8, plus 2pts of stretchable flank above and below the
# rigid run.
#   y: middle band 8..36, rigid 10..34 (2pts of stretch above and below)
#   x: middle band 2..6,  rigid 3..5   (1pt of stretch each side)
#
# The x rigid run is what keeps the dots round if the app overrides
# handleThickness to something wider than the natural 8pts. It only just fits
# now -- a 4pt band cannot hold a rigid run wider than 2pts and still leave
# stretchable material on both flanks (the engine divides by lead+trail).
# Narrow the bar any further and this rigid part has to go; the bar would then
# only be safe at its natural thickness.
rigid_part:
  - {axis: x, begin_pts: 3, length_pts: 2,  sections: All}
  - {axis: y, begin_pts: 10, length_pts: 24, sections: All}

# Eased, with the gloss confined to the top frame (8/44): the flanks stretch
# from 2pt slices, so a linear gradient would leave the grey above the dots
# visibly lighter than below.
gradient_ease: 3.0
gloss_frac: 0.18

stretch_axis: y
# Dots 2.5 -> 2pts, so the run fits inside the narrower x rigid part (3..5)
# and keeps a proper margin inside an 8pt bar. Gap stays at 8: the mid section
# is as long as before, and the spacing was set deliberately.
# Span is 2*8 + 2 = 18pts centred at y 22, i.e. 13..31 -- inside the 10..34
# rigid run, so they stay put however long the bar is drawn.
glyph: {type: dots, direction: vertical, count: 3, dot_pts: 2, gap_pts: 8}
