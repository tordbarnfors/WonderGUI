recipe: raised_control
shape: rect
# The VERTICAL bar, used by SplitPanelX (children side by side, dragged
# left/right). SplitPanel takes the bar's thickness from this skin's WIDTH
# when axis == Axis::X (wg_splitpanel.cpp, _handleThickness), so 12pts wide
# is the bar thickness; the height is only a starting size -- the bar is
# stretched to the panel's full height.
size_pts: [12, 32]
radius_pts: 3
axis: x
spacing_pts: 1
states: [Default, Hovered, Pressed, Disabled]
# Left/right stay at 3 (= radius_pts): any wider and the middle COLUMN is
# too narrow to hold a rigid run with stretch on both sides. Top/bottom are
# 8, and the block grew 24 -> 32pts to afford them, so the eased gradient
# below has somewhere to put the colour change -- at 3pts the caps were too
# thin to absorb it and the body still banded.
frame_pts: [8, 3, 8, 3]
padding_pts: 3
# The bar normally grows along its length, but the app can also set a
# different handleThickness, which stretches it across. So BOTH axes are
# pinned -- blitNinePatch nests them, splitting the centre cell by
# rigidPartY and applying rigidPartX within each resulting band.
#   x: middle band 3..9,  rigid 4..8  (1pt of stretch each side)
#   y: middle band 8..24, rigid 10..22 (2pts of stretch each side)
# Dots span 2.5pts across (x 4.75..7.25) and 10.5pts along (y 10.75..21.25),
# both inside their rigid run.
rigid_part:
  - {axis: x, begin_pts: 4, length_pts: 4,  sections: All}
  - {axis: y, begin_pts: 10, length_pts: 12, sections: All}
# Which axis the preview stretches first -- the bar's length, i.e. normal use.
stretch_axis: y
glyph: {type: dots, direction: vertical, count: 3, dot_pts: 2.5, gap_pts: 4}

# See ScrollbarHandleY: stretched along its length the body must stay a
# near-uniform mid-blue, so the gradient is eased out into the 8pt caps and
# the gloss is confined to the top one.
gradient_ease: 3.0
gloss_frac: 0.25
