recipe: raised_control
palette_family: plate
shape: rect
# The HORIZONTAL bar, used by SplitPanelY (children stacked, dragged
# up/down). SplitPanel takes the bar's thickness from this skin's HEIGHT
# when axis == Axis::Y (wg_splitpanel.cpp, _handleThickness), so 8pts tall
# is the bar thickness; the width is only a starting size -- the bar is
# stretched to the panel's full width.
#
# palette_family: plate gives it Plate's grey rather than the blue accent, so
# it reads as furniture, while still picking up the normal hover/pressed/
# disabled treatment from STATE_STYLE.
#
# Thickness narrowed 12 -> 8, in step with SplitHandleX. Here the thickness is
# also the axis the gradient runs along, so the whole vertical ramp now lives
# in 8pts rather than 12 -- it reads a little crisper, which is what you want
# on a thin bar.
size_pts: [44, 8]
radius_pts: 2
axis: x
spacing_pts: 1
states: [Default, Hovered, Pressed, Disabled]
frame_pts: [2, 8, 2, 8]
padding_pts: 2

# Geometry, in block coords. The mid (rigid) section is 24pts, which sets the
# block width: frames 8+8, plus 2pts of stretchable flank left and right of
# the rigid run.
#   x: middle band 8..36, rigid 10..34 (2pts of stretch left and right)
#   y: middle band 2..6,  rigid 3..5   (1pt of stretch each side)
#
# The y rigid run is what keeps the dots round if the app overrides
# handleThickness to something taller than the natural 8pts. It only just fits
# now -- a 4pt band cannot hold a rigid run taller than 2pts and still leave
# stretchable material on both flanks (the engine divides by lead+trail).
# Narrow the bar any further and this rigid part has to go; the bar would then
# only be safe at its natural thickness.
rigid_part:
  - {axis: y, begin_pts: 3, length_pts: 2,  sections: All}
  - {axis: x, begin_pts: 10, length_pts: 24, sections: All}

# No ease needed: this bar stretches across the grain of the vertical
# gradient, so the grey keeps Plate's own tone exactly.

stretch_axis: x
# Dots 2.5 -> 2pts, so the run fits inside the narrower y rigid part (3..5)
# and keeps a proper margin inside an 8pt bar. Gap stays at 8: the mid section
# is as long as before, and the spacing was set deliberately.
# Span is 2*8 + 2 = 18pts centred at x 22, i.e. 13..31 -- inside the 10..34
# rigid run, so they stay put however wide the bar is drawn.
glyph: {type: dots, direction: horizontal, count: 3, dot_pts: 2, gap_pts: 8}
